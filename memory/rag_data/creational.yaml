category: "Creational"
def: "Creational design patterns provide various object creation mechanisms, which increase flexibility and reuse of existing code."
patterns:
  - id: "pattern_builder"
    name: "Builder"
    intent: |
      Builder is a creational design pattern that lets you construct complex objects step by step. The pattern allows you to produce different types and representations of an object using the same construction code.
    problem: |
      Imagine a complex object that requires laborious, step-by-step initialization of many fields and nested objects. Such initialization code is usually buried inside a monstrous constructor with lots of parameters. Or even worse: scattered all over the client code. You might make the program too complex by creating a subclass for every possible configuration of an object. The constructor with lots of parameters has its downside: not all the parameters are needed at all times. In most cases most of the parameters will be unused, making the constructor calls pretty ugly.
    solution: |
      The Builder pattern suggests that you extract the object construction code out of its own class and move it to separate objects called builders. The pattern organizes object construction into a set of steps (buildWalls, buildDoor, etc.). To create an object, you execute a series of these steps on a builder object. The important part is that you don’t need to call all of the steps. You can go further and extract a series of calls to the builder steps you use to construct a product into a separate class called director. The director class defines the order in which to execute the building steps, while the builder provides the implementation for those steps.
    structure: |
      The Builder interface declares product construction steps that are common to all types of builders. Concrete Builders provide different implementations of the construction steps. Products are resulting objects. The Director class defines the order in which to call construction steps, so you can create and reuse specific configurations of products. The Client must associate one of the builder objects with the director.
    applicability: |
      Use the Builder pattern to get rid of a “telescoping constructor”. The Builder pattern lets you build objects step by step, using only those steps that you really need. Use the Builder pattern when you want your code to be able to create different representations of some product. Use the Builder to construct Composite trees or other complex objects.
    how_to_implement: |
      Make sure that you can clearly define the common construction steps for building all available product representations. Declare these steps in the base builder interface. Create a concrete builder class for each of the product representations and implement their construction steps. Don’t forget about implementing a method for fetching the result of the construction. Think about creating a director class. The client code creates both the builder and the director objects.
    pros_and_cons: |
      Pros: You can construct objects step-by-step, defer construction steps or run steps recursively. You can reuse the same construction code when building various representations of products. Single Responsibility Principle. You can isolate complex construction code from the business logic of the product. 
      Cons: The overall complexity of the code increases since the pattern requires creating multiple new classes.
    relations_with_other_patterns: |
      Many designs start by using Factory Method and evolve toward Abstract Factory, Prototype, or Builder. Builder focuses on constructing complex objects step by step. Abstract Factory specializes in creating families of related objects. You can use Builder when creating complex Composite trees because you can program its construction steps to work recursively. You can combine Builder with Bridge: the director class plays the role of the abstraction, while different builders act as implementations. Abstract Factories, Builders and Prototypes can all be implemented as Singletons.

  - id: "pattern_prototype"
    name: "Prototype"
    intent: |
      Prototype is a creational design pattern that lets you copy existing objects without making your code dependent on their classes.
    problem: |
      Say you have an object, and you want to create an exact copy of it. First, you have to create a new object of the same class. Then you have to go through all the fields of the original object and copy their values over to the new object. Not all objects can be copied that way because some of the object’s fields may be private and not visible from outside of the object itself. Since you have to know the object’s class to create a duplicate, your code becomes dependent on that class.
    solution: |
      The Prototype pattern delegates the cloning process to the actual objects that are being cloned. The pattern declares a common interface for all objects that support cloning. This interface lets you clone an object without coupling your code to the class of that object. The method creates an object of the current class and carries over all of the field values of the old object into the new one.
    structure: |
      The Prototype interface declares the cloning methods. The Concrete Prototype class implements the cloning method. The Client can produce a copy of any object that follows the prototype interface. The Prototype Registry provides an easy way to access frequently-used prototypes.
    applicability: |
      Use the Prototype pattern when your code shouldn’t depend on the concrete classes of objects that you need to copy. Use the pattern when you want to reduce the number of subclasses that only differ in the way they initialize their respective objects. Instead of instantiating a subclass that matches some configuration, the client can simply look for an appropriate prototype and clone it.
    how_to_implement: |
      Create the prototype interface and declare the clone method in it. A prototype class must define the alternative constructor that accepts an object of that class as an argument. The constructor must copy the values of all fields defined in the class from the passed object into the newly created instance. If you’re changing a subclass, you must call the parent constructor to let the superclass handle the cloning of its private fields. Optionally, create a centralized prototype registry to store a catalog of frequently used prototypes.
    pros_and_cons: |
      Pros: You can clone objects without coupling to their concrete classes. You can get rid of repeated initialization code in favor of cloning pre-built prototypes. You can produce complex objects more conveniently. You get an alternative to inheritance when dealing with configuration presets for complex objects.
      Cons: Cloning complex objects that have circular references might be very tricky.
    relations_with_other_patterns: |
      Abstract Factory classes are often based on a set of Factory Methods, but you can also use Prototype to compose the methods on these classes. Prototype can help when you need to save copies of Commands into history. Designs that make heavy use of Composite and Decorator can often benefit from using Prototype. Prototype isn’t based on inheritance, so it doesn’t have its drawbacks. Sometimes Prototype can be a simpler alternative to Memento.

  - id: "pattern_singleton"
    name: "Singleton"
    intent: |
      Singleton is a creational design pattern that lets you ensure that a class has only one instance, while providing a global access point to this instance.
    problem: |
      Ensure that a class has just a single instance. The most common reason for this is to control access to some shared resource—for example, a database or a file. Provide a global access point to that instance. Just like a global variable, the Singleton pattern lets you access some object from anywhere in the program. However, it also protects that instance from being overwritten by other code.
    solution: |
      Make the default constructor private, to prevent other objects from using the new operator with the Singleton class. Create a static creation method that acts as a constructor. Under the hood, this method calls the private constructor to create an object and saves it in a static field. All following calls to this method return the cached object.
    structure: |
      The Singleton class declares the static method getInstance that returns the same instance of its own class. The Singleton’s constructor should be hidden from the client code. Calling the getInstance method should be the only way of getting the Singleton object.
    applicability: |
      Use the Singleton pattern when a class in your program should have just a single instance available to all clients; for example, a single database object shared by different parts of the program. Use the Singleton pattern when you need stricter control over global variables. Unlike global variables, the Singleton pattern guarantees that there’s just one instance of a class.
    how_to_implement: |
      Add a private static field to the class for storing the singleton instance. Declare a public static creation method for getting the singleton instance. Implement “lazy initialization” inside the static method. It should create a new object on its first call and put it into the static field. Make the constructor of the class private. Go over the client code and replace all direct calls to the singleton’s constructor with calls to its static creation method.
    pros_and_cons: |
      Pros: You can be sure that a class has only a single instance. You gain a global access point to that instance. The singleton object is initialized only when it’s requested for the first time.
      Cons: Violates the Single Responsibility Principle. The Singleton pattern can mask bad design, for instance, when the components of the program know too much about each other. The pattern requires special treatment in a multithreaded environment. It may be difficult to unit test the client code of the Singleton.
    relations_with_other_patterns: |
      A Facade class can often be transformed into a Singleton since a single facade object is sufficient in most cases. Flyweight would resemble Singleton if you somehow managed to reduce all shared states of the objects to just one flyweight object. There should be only one Singleton instance, whereas a Flyweight class can have multiple instances. Abstract Factories, Builders and Prototypes can all be implemented as Singletons.

  - id: "pattern_factory_method"
    name: "Factory Method"
    intent: |
      Factory Method is a creational design pattern that provides an interface for creating objects in a superclass, but allows subclasses to alter the type of objects that will be created.
    problem: |
      Adding a new class to the program isn’t that simple if the rest of the code is already coupled to existing classes. As a result, you will end up with pretty nasty code, riddled with conditionals that switch the app’s behavior depending on the class of transportation objects.
    solution: |
      The Factory Method pattern suggests that you replace direct object construction calls (using the new operator) with calls to a special factory method. Now you can override the factory method in a subclass and change the class of products being created by the method.
    structure: |
      The Product declares the interface, which is common to all objects that can be produced by the creator and its subclasses. Concrete Products are different implementations of the product interface. The Creator class declares the factory method that returns new product objects. Concrete Creators override the base factory method so it returns a different type of product.
    applicability: |
      Use the Factory Method when you don’t know beforehand the exact types and dependencies of the objects your code should work with. Use the Factory Method when you want to provide users of your library or framework with a way to extend its internal components. Use the Factory Method when you want to save system resources by reusing existing objects instead of rebuilding them each time.
    how_to_implement: |
      Make all products follow the same interface. Add an empty factory method inside the creator class. The return type of the method should match the common product interface. In the creator’s code find all references to product constructors. One by one, replace them with calls to the factory method. Now, create a set of creator subclasses for each type of product listed in the factory method. Override the factory method in the subclasses and extract the appropriate bits of construction code from the base method.
    pros_and_cons: |
      Pros: You avoid tight coupling between the creator and the concrete products. Single Responsibility Principle. You can move the product creation code into one place in the program. Open/Closed Principle. You can introduce new types of products into the program without breaking existing client code.
      Cons: The code may become more complicated since you need to introduce a lot of new subclasses to implement the pattern.
    relations_with_other_patterns: |
      Abstract Factory classes are often based on a set of Factory Methods. You can use Factory Method along with Iterator to let collection subclasses return different types of iterators. Factory Method is based on inheritance but doesn’t require an initialization step. Factory Method is a specialization of Template Method.

  - id: "pattern_abstract_factory"
    name: "Abstract Factory"
    intent: |
      Abstract Factory is a creational design pattern that lets you produce families of related objects without specifying their concrete classes.
    problem: |
      You need a way to create individual furniture objects so that they match other objects of the same family. Customers get quite mad when they receive non-matching furniture. Also, you don’t want to change existing code when adding new products or families of products to the program.
    solution: |
      Explicitly declare interfaces for each distinct product of the product family (e.g., chair, sofa or coffee table). Declare the Abstract Factory—an interface with a list of creation methods for all products that are part of the product family. For each variant of a product family, we create a separate factory class based on the AbstractFactory interface.
    structure: |
      Abstract Products declare interfaces for a set of distinct but related products which make up a product family. Concrete Products are various implementations of abstract products, grouped by variants. The Abstract Factory interface declares a set of methods for creating each of the abstract products. Concrete Factories implement creation methods of the abstract factory.
    applicability: |
      Use the Abstract Factory when your code needs to work with various families of related products, but you don’t want it to depend on the concrete classes of those products. Consider implementing the Abstract Factory when you have a class with a set of Factory Methods that blur its primary responsibility.
    how_to_implement: |
      Map out a matrix of distinct product types versus variants of these products. Declare abstract product interfaces for all product types. Declare the abstract factory interface with a set of creation methods for all abstract products. Implement a set of concrete factory classes, one for each product variant. Create factory initialization code somewhere in the app. Scan through the code and find all direct calls to product constructors. Replace them with calls to the appropriate creation method on the factory object.
    pros_and_cons: |
      Pros: You can be sure that the products you’re getting from a factory are compatible with each other. You avoid tight coupling between concrete products and client code. Single Responsibility Principle. You can extract the product creation code into one place. Open/Closed Principle. You can introduce new variants of products without breaking existing client code.
      Cons: The code may become more complicated than it should be, since a lot of new interfaces and classes are introduced along with the pattern.
    relations_with_other_patterns: |
      Builder focuses on constructing complex objects step by step. Abstract Factory specializes in creating families of related objects. Abstract Factory returns the product immediately, whereas Builder lets you run some additional construction steps. Abstract Factory can serve as an alternative to Facade when you only want to hide the way the subsystem objects are created. You can use Abstract Factory along with Bridge. Abstract Factories, Builders and Prototypes can all be implemented as Singletons.