category: "Behavioral"
def: "Behavioral design patterns are concerned with algorithms and the assignment of responsibilities between objects."
patterns:
  - id: "pattern_chain_of_responsibility"
    name: "Chain of Responsibility"
    intent: |
      Chain of Responsibility is a behavioral design pattern that lets you pass requests along a chain of handlers. Upon receiving a request, each handler decides either to process the request or to pass it to the next handler in the chain.
    problem: |
      Imagine that you’re working on an online ordering system. You want to restrict access to the system so only authenticated users can create orders. Also, users who have administrative permissions must have full access to all orders. After a bit of planning, you realized that these checks must be performed sequentially. During the next few months, you implemented several more of those sequential checks (data sanitization, brute-force protection, caching). With each new check the code became bigger, messier, and uglier. Changing one check sometimes affected the others. Worst of all, when you tried to reuse the checks to protect other components of the system, you had to duplicate some of the code. The system became very hard to comprehend and expensive to maintain.
    solution: |
      The Chain of Responsibility relies on transforming particular behaviors into stand-alone objects called handlers. Each check should be extracted to its own class with a single method that performs the check. The request, along with its data, is passed to this method as an argument. The pattern suggests that you link these handlers into a chain. Each linked handler has a field for storing a reference to the next handler in the chain. In addition to processing a request, handlers pass the request further along the chain until all handlers have had a chance to process it. A handler can decide not to pass the request further down the chain and effectively stop any further processing. There’s a slightly different approach in which, upon receiving a request, a handler decides whether it can process it. If it can, it doesn’t pass the request any further.
    structure: |
      The Handler declares the interface, common for all concrete handlers. It usually contains just a single method for handling requests, but sometimes it may also have another method for setting the next handler on the chain. The Base Handler is an optional class where you can put the boilerplate code that’s common to all handler classes. Usually, this class defines a field for storing a reference to the next handler. Concrete Handlers contain the actual code for processing requests. Upon receiving a request, each handler must decide whether to process it and whether to pass it along the chain. The Client may compose chains just once or compose them dynamically.
    applicability: |
      Use the Chain of Responsibility pattern when your program is expected to process different kinds of requests in various ways, but the exact types of requests and their sequences are unknown beforehand. Use the pattern when it’s essential to execute several handlers in a particular order. Use the CoR pattern when the set of handlers and their order are supposed to change at runtime.
    how_to_implement: |
      Declare the handler interface and describe the signature of a method for handling requests. Decide how the client will pass the request data into the method. To eliminate duplicate boilerplate code, create an abstract base handler class with a field for storing a reference to the next handler in the chain. Implement the convenient default behavior for the handling method, which is to forward the request to the next object unless there’s none left. One by one create concrete handler subclasses and implement their handling methods. The client may either assemble chains on its own or receive pre-built chains from other objects.
    pros_and_cons: |
      Pros: You can control the order of request handling. Single Responsibility Principle. You can decouple classes that invoke operations from classes that perform operations. Open/Closed Principle. You can introduce new handlers into the app without breaking the existing client code.
      Cons: Some requests may end up unhandled.
    relations_with_other_patterns: |
      Chain of Responsibility passes a request sequentially along a dynamic chain of potential receivers until one of them handles it. Chain of Responsibility is often used in conjunction with Composite. Handlers in Chain of Responsibility can be implemented as Commands. Chain of Responsibility and Decorator have very similar class structures. Both patterns rely on recursive composition to pass the execution through a series of objects. The CoR handlers can execute arbitrary operations independently of each other. They can also stop passing the request further at any point. Decorators aren't allowed to break the flow of the request.

  - id: "pattern_command"
    name: "Command"
    intent: |
      Command is a behavioral design pattern that turns a request into a stand-alone object that contains all information about the request. This transformation lets you pass requests as a method arguments, delay or queue a request’s execution, and support undoable operations.
    problem: |
      Imagine that you’re working on a new text-editor app. You created a very neat Button class that can be used for buttons on the toolbar, as well as for generic buttons in various dialogs. While all of these buttons look similar, they’re all supposed to do different things. The simplest solution is to create tons of subclasses for each place where the button is used. First, you have an enormous number of subclasses, risking breaking the code each time you modify the base Button class. Your GUI code has become awkwardly dependent on the volatile code of the business logic. Some operations, such as copying/pasting text, would need to be invoked from multiple places (toolbar, context menu, shortcuts). You have to either duplicate the operation’s code in many classes or make menus dependent on buttons.
    solution: |
      Good software design is often based on the principle of separation of concerns, breaking an app into layers (GUI layer and business logic layer). The Command pattern suggests that GUI objects shouldn’t send requests to business logic directly. Instead, you should extract all of the request details, such as the object being called, the name of the method and the list of arguments into a separate command class with a single method that triggers this request. Command objects serve as links between various GUI and business logic objects. Make your commands implement the same interface. This lets you use various commands with the same request sender, without coupling it to concrete classes of commands.
    structure: |
      The Sender class (aka invoker) is responsible for initiating requests. This class must have a field for storing a reference to a command object. The Command interface usually declares just a single method for executing the command. Concrete Commands implement various kinds of requests. A concrete command isn’t supposed to perform the work on its own, but rather to pass the call to one of the business logic objects. The Receiver class contains some business logic. Almost any object may act as a receiver. The Client creates and configures concrete command objects and passes all request parameters into the command's constructor.
    applicability: |
      Use the Command pattern when you want to parameterize objects with operations. Use the Command pattern when you want to queue operations, schedule their execution, or execute them remotely. A command can be serialized to a string that can be easily written to a file or a database. Use the Command pattern when you want to implement reversible operations (undo/redo).
    how_to_implement: |
      Declare the command interface with a single execution method. Start extracting requests into concrete command classes that implement the command interface. Each class must have a set of fields for storing the request arguments along with a reference to the actual receiver object. Identify classes that will act as senders and add fields for storing commands. Senders should communicate with their commands only via the command interface. Change the senders so they execute the command instead of sending a request to the receiver directly.
    pros_and_cons: |
      Pros: Single Responsibility Principle. You can decouple classes that invoke operations from classes that perform these operations. Open/Closed Principle. You can introduce new commands into the app without breaking existing client code. You can implement undo/redo. You can implement deferred execution of operations. You can assemble a set of simple commands into a complex one.
      Cons: The code may become more complicated since you’re introducing a whole new layer between senders and receivers.
    relations_with_other_patterns: |
      Command establishes unidirectional connections between senders and receivers. Handlers in Chain of Responsibility can be implemented as Commands. You can use Command and Memento together when implementing “undo”. Command and Strategy may look similar because you can use both to parameterize an object with some action, but they have different intents. Prototype can help when you need to save copies of Commands into history. You can treat Visitor as a powerful version of the Command pattern.

  - id: "pattern_iterator"
    name: "Iterator"
    intent: |
      Iterator is a behavioral design pattern that lets you traverse elements of a collection without exposing its underlying representation (list, stack, tree, etc.).
    problem: |
      Collections are one of the most used data types in programming. Most collections store their elements in simple lists. However, some of them are based on stacks, trees, graphs and other complex data structures. No matter how a collection is structured, it must provide some way of accessing its elements so that other code can use these elements. How do you sequentially traverse elements of a complex data structure, such as a tree? One day you might be just fine with depth-first traversal, the next day breadth-first. Adding more and more traversal algorithms to the collection gradually blurs its primary responsibility, which is efficient data storage. The client code may not even care how they store their elements, but you have no option other than to couple your code to specific collection classes.
    solution: |
      The main idea of the Iterator pattern is to extract the traversal behavior of a collection into a separate object called an iterator. In addition to implementing the algorithm itself, an iterator object encapsulates all of the traversal details, such as the current position and how many elements are left till the end. Several iterators can go through the same collection at the same time, independently of each other. Iterators provide one primary method for fetching elements. The client can keep running this method until it doesn’t return anything. All iterators must implement the same interface.
    structure: |
      The Iterator interface declares the operations required for traversing a collection: fetching the next element, retrieving the current position, restarting iteration, etc. Concrete Iterators implement specific algorithms for traversing a collection. The Collection interface declares one or multiple methods for getting iterators compatible with the collection. Concrete Collections return new instances of a particular concrete iterator class. The Client works with both collections and iterators via their interfaces.
    applicability: |
      Use the Iterator pattern when your collection has a complex data structure under the hood, but you want to hide its complexity from clients. Use the pattern to reduce duplication of the traversal code across your app. Use the Iterator when you want your code to be able to traverse different data structures or when types of these structures are unknown beforehand.
    how_to_implement: |
      Declare the iterator interface. At the very least, it must have a method for fetching the next element. Declare the collection interface and describe a method for fetching iterators. Implement concrete iterator classes for the collections. An iterator object must be linked with a single collection instance. Implement the collection interface in your collection classes to provide the client with a shortcut for creating iterators. Go over the client code to replace all of the collection traversal code with the use of iterators.
    pros_and_cons: |
      Pros: Single Responsibility Principle. You can clean up the client code and the collections by extracting bulky traversal algorithms into separate classes. Open/Closed Principle. You can implement new types of collections and iterators and pass them to existing code without breaking anything. You can iterate over the same collection in parallel. You can delay an iteration and continue it when needed.
      Cons: Applying the pattern can be an overkill if your app only works with simple collections. Using an iterator may be less efficient than going through elements of some specialized collections directly.
    relations_with_other_patterns: |
      You can use Iterators to traverse Composite trees. You can use Factory Method along with Iterator to let collection subclasses return different types of iterators. You can use Memento along with Iterator to capture the current iteration state and roll it back. You can use Visitor along with Iterator to traverse a complex data structure.

  - id: "pattern_mediator"
    name: "Mediator"
    intent: |
      Mediator is a behavioral design pattern that lets you reduce chaotic dependencies between objects. The pattern restricts direct communications between the objects and forces them to collaborate only via a mediator object.
    problem: |
      Say you have a dialog for creating and editing customer profiles. It consists of various form controls such as text fields, checkboxes, buttons, etc. Some of the form elements may interact with others. For instance, selecting a checkbox may reveal a hidden text field. Another example is the submit button that has to validate values of all fields before saving the data. By having this logic implemented directly inside the code of the form elements you make these elements’ classes much harder to reuse in other forms of the app. You won’t be able to use that checkbox class inside another form because it’s coupled to the text field.
    solution: |
      The Mediator pattern suggests that you should cease all direct communication between the components which you want to make independent of each other. Instead, these components must collaborate indirectly, by calling a special mediator object that redirects the calls to appropriate components. As a result, the components depend only on a single mediator class instead of being coupled to dozens of their colleagues. The button's single job is to notify the dialog about the click. Upon receiving this notification, the dialog itself performs the validations or passes the task to individual elements.
    structure: |
      Components are various classes that contain some business logic. Each component has a reference to a mediator, declared with the type of the mediator interface. The Mediator interface declares methods of communication with components, usually a single notification method. Concrete Mediators encapsulate relations between various components and often keep references to all components they manage. Components must not be aware of other components; they must only notify the mediator.
    applicability: |
      Use the Mediator pattern when it’s hard to change some of the classes because they are tightly coupled to a bunch of other classes. Use the pattern when you can’t reuse a component in a different program because it’s too dependent on other components. Use the Mediator when you find yourself creating tons of component subclasses just to reuse some basic behavior in various contexts.
    how_to_implement: |
      Identify a group of tightly coupled classes which would benefit from being more independent. Declare the mediator interface and describe the desired communication protocol. Implement the concrete mediator class. Consider storing references to all components inside the mediator. Components should store a reference to the mediator object. Change the components’ code so that they call the mediator’s notification method instead of methods on other components. Extract the code that involves calling other components into the mediator class.
    pros_and_cons: |
      Pros: Single Responsibility Principle. You can extract the communications between various components into a single place. Open/Closed Principle. You can introduce new mediators without having to change the actual components. You can reduce coupling between various components of a program. You can reuse individual components more easily.
      Cons: Over time a mediator can evolve into a God Object.
    relations_with_other_patterns: |
      Mediator eliminates direct connections between senders and receivers, forcing them to communicate indirectly via a mediator object. Facade and Mediator have similar jobs. Facade defines a simplified interface to a subsystem, but doesn't introduce new functionality and objects can still communicate directly. Mediator centralizes communication and components don't communicate directly. The difference between Mediator and Observer is often elusive, and they are sometimes combined (where Mediator acts as Publisher and components as Subscribers).

  - id: "pattern_memento"
    name: "Memento"
    intent: |
      Memento is a behavioral design pattern that lets you save and restore the previous state of an object without revealing the details of its implementation.
    problem: |
      Imagine that you’re creating a text editor app. You decided to let users undo any operations. Before performing any operation, the app records the state of all objects and saves it. To produce a snapshot, you’d need to go over all the fields in an object and copy their values. This only works if the object has relaxed access restrictions. Most real objects won’t let others peek inside them, hiding data in private fields. If you expose all internal details, classes become fragile and dependent on every little change to the snapshot class. You either expose all internal details, or restrict access making it impossible to produce snapshots.
    solution: |
      All problems are caused by broken encapsulation. The Memento pattern delegates creating the state snapshots to the actual owner of that state, the originator object. The editor class itself can make the snapshot since it has full access to its own state. The pattern suggests storing the copy of the object’s state in a special object called memento. The contents of the memento aren’t accessible to any other object except the one that produced it. Other objects (caretakers) must communicate with mementos using a limited interface which only allows fetching metadata.
    structure: |
      The Originator class can produce snapshots of its own state, as well as restore its state from snapshots when needed. The Memento is a value object that acts as a snapshot of the originator’s state (usually immutable). The Caretaker knows not only “when” and “why” to capture the originator’s state, but also when the state should be restored. It keeps track of history by storing a stack of mementos. Implementation variations include nested classes, an intermediate interface, or strict encapsulation where the originator passes itself to the memento.
    applicability: |
      Use the Memento pattern when you want to produce snapshots of the object’s state to be able to restore a previous state of the object. Use the pattern when direct access to the object’s fields/getters/setters violates its encapsulation.
    how_to_implement: |
      Determine what class will play the role of the originator. Create the memento class declaring fields that mirror the originator class. Make the memento class immutable. If language supports it, nest memento inside originator, otherwise extract a blank interface. Add a method for producing mementos to the originator class. Add a method for restoring the originator’s state. The caretaker should request new mementos, store them, and pass them back for restoration.
    pros_and_cons: |
      Pros: You can produce snapshots of the object’s state without violating its encapsulation. You can simplify the originator’s code by letting the caretaker maintain the history.
      Cons: The app might consume lots of RAM if clients create mementos too often. Caretakers should track the originator’s lifecycle to destroy obsolete mementos. Most dynamic programming languages can’t guarantee that the state within the memento stays untouched.
    relations_with_other_patterns: |
      You can use Command and Memento together when implementing “undo”. You can use Memento along with Iterator to capture the current iteration state and roll it back if necessary. Sometimes Prototype can be a simpler alternative to Memento if the object is straightforward and doesn't have links to external resources.

  - id: "pattern_observer"
    name: "Observer"
    intent: |
      Observer is a behavioral design pattern that lets you define a subscription mechanism to notify multiple objects about any events that happen to the object they’re observing.
    problem: |
      Imagine you have a Customer and a Store. The customer is interested in a new iPhone. The customer could visit the store every day (wasting time). Or the store could send tons of spam emails to all customers each time a new product is available (upsetting customers not interested). Either the customer wastes time checking or the store wastes resources notifying the wrong customers.
    solution: |
      The object that has some interesting state is the publisher. All other objects that want to track changes are subscribers. The Observer pattern suggests adding a subscription mechanism to the publisher class so individual objects can subscribe to or unsubscribe from a stream of events. This consists of an array field for storing subscriber references and methods for adding/removing them. When an event happens, the publisher goes over its subscribers and calls a specific notification method on their objects. All subscribers must implement the same interface.
    structure: |
      The Publisher issues events of interest to other objects. Publishers contain a subscription infrastructure (list of subscribers, add/remove methods). The Subscriber interface declares the notification interface (usually an update method). Concrete Subscribers perform some actions in response to notifications. The Client creates publisher and subscriber objects separately and registers subscribers.
    applicability: |
      Use the Observer pattern when changes to the state of one object may require changing other objects, and the actual set of objects is unknown beforehand or changes dynamically. Use the pattern when some objects in your app must observe others, but only for a limited time or in specific cases.
    how_to_implement: |
      Break logic into publisher (core functionality) and subscriber classes. Declare the subscriber interface (update method). Declare the publisher interface (subscribe/unsubscribe methods). Put subscription list and implementation in an abstract class or compose it via a helper object. Create concrete publisher classes that notify subscribers. Implement update methods in concrete subscriber classes.
    pros_and_cons: |
      Pros: Open/Closed Principle. You can introduce new subscriber classes without having to change the publisher’s code. You can establish relations between objects at runtime.
      Cons: Subscribers are notified in random order.
    relations_with_other_patterns: |
      Observer lets receivers dynamically subscribe to and unsubscribe from receiving requests. The difference between Mediator and Observer is often elusive. A popular implementation of Mediator relies on Observer (mediator is publisher, components are subscribers).

  - id: "pattern_state"
    name: "State"
    intent: |
      State is a behavioral design pattern that lets an object alter its behavior when its internal state changes. It appears as if the object changed its class.
    problem: |
      The State pattern is closely related to the Finite-State Machine. At any given moment, there’s a finite number of states which a program can be in. The program behaves differently and can switch states via transitions. Applied to objects, a Document can be Draft, Moderation, or Published. State machines are usually implemented with lots of conditional statements (if or switch). This reveals a weakness when adding more states: methods contain monstrous conditionals. Any change to transition logic requires changing conditionals everywhere, making it a bloated mess.
    solution: |
      The State pattern suggests that you create new classes for all possible states of an object and extract all state-specific behaviors into these classes. The original object, called context, stores a reference to one of the state objects that represents its current state, and delegates all the state-related work to that object. To transition the context, replace the active state object with another object. All state classes follow the same interface.
    structure: |
      Context stores a reference to a concrete state object and delegates state-specific work to it. Context exposes a setter for passing it a new state. The State interface declares state-specific methods. Concrete States provide implementations. State objects may store a backreference to the context object to fetch info and initiate transitions.
    applicability: |
      Use the State pattern when you have an object that behaves differently depending on its current state, the number of states is enormous, and the state-specific code changes frequently. Use the pattern when you have a class polluted with massive conditionals that alter how the class behaves according to values of its fields. Use State when you have a lot of duplicate code across similar states and transitions.
    how_to_implement: |
      Decide what class acts as the context. Declare the state interface. Create classes derived from the state interface for every state. Extract state-related code into these classes. Add a reference field to the context for the state interface type and a setter. Replace conditionals in the context with calls to the state object. Transition by creating instances of state classes and passing them to the context.
    pros_and_cons: |
      Pros: Single Responsibility Principle. Open/Closed Principle. Introduce new states without changing existing state classes or context. Simplify code by eliminating bulky conditionals.
      Cons: Applying the pattern can be overkill if a state machine has only a few states or rarely changes.
    relations_with_other_patterns: |
      Bridge, State, Strategy, and Adapter share similar structures based on composition. State can be considered an extension of Strategy. Strategy makes objects independent, whereas State doesn't restrict dependencies between concrete states, letting them alter the state of the context.

  - id: "pattern_strategy"
    name: "Strategy"
    intent: |
      Strategy is a behavioral design pattern that lets you define a family of algorithms, put each of them into a separate class, and make their objects interchangeable.
    problem: |
      You create a navigation app that builds routes. First, it only did roads. Then walking routes. Then public transport. Then cyclists. Each time you added a new routing algorithm, the main class of the navigator doubled in size. The beast became too hard to maintain. Any change to one algorithm affected the whole class. Implementing new features caused constant merge conflicts in team environments.
    solution: |
      Take a class that does something specific in a lot of different ways and extract all of these algorithms into separate classes called strategies. The original class, called context, must have a field for storing a reference to one of the strategies. The context delegates the work to a linked strategy object. The context isn’t responsible for selecting the algorithm; the client passes the desired strategy. The context works with all strategies through a generic interface.
    structure: |
      The Context maintains a reference to a concrete strategy and communicates via the strategy interface. The Strategy interface is common to all concrete strategies and declares a method to execute the strategy. Concrete Strategies implement different variations of an algorithm. The Client creates a specific strategy object and passes it to the context.
    applicability: |
      Use the Strategy pattern when you want to use different variants of an algorithm within an object and switch them at runtime. Use the Strategy when you have a lot of similar classes that only differ in the way they execute some behavior. Use the pattern to isolate business logic from implementation details of algorithms. Use the pattern when your class has a massive conditional statement that switches between variants of the same algorithm.
    how_to_implement: |
      Identify an algorithm prone to frequent changes or massive conditionals. Declare the strategy interface. Extract all algorithms into their own classes implementing the interface. Add a field to the context for storing the reference to a strategy object, along with a setter. Clients must associate the context with a suitable strategy.
    pros_and_cons: |
      Pros: You can swap algorithms used inside an object at runtime. You can isolate the implementation details of an algorithm. You can replace inheritance with composition. Open/Closed Principle.
      Cons: Overkill for a couple of algorithms that rarely change. Clients must be aware of differences between strategies to select the right one. Functional programming offers a lightweight alternative to the class bloat.
    relations_with_other_patterns: |
      Command and Strategy parameterize an object, but Command converts operations to objects (queueing, undo), while Strategy swaps algorithms doing the same thing. Decorator changes the skin, Strategy changes the guts. Template Method is based on inheritance (class level), Strategy is based on composition (object level). State is an extension of Strategy where states can initiate transitions.

  - id: "pattern_template_method"
    name: "Template Method"
    intent: |
      Template Method is a behavioral design pattern that defines the skeleton of an algorithm in the superclass but lets subclasses override specific steps of the algorithm without changing its structure.
    problem: |
      You create a data mining app analyzing corporate documents (DOC, CSV, PDF). The classes have a lot of similar code. Code for dealing with formats was different, but data processing and analysis were almost identical. It would be great to get rid of code duplication while leaving the structure intact. Client code also had lots of conditionals picking the proper course of action based on the class.
    solution: |
      Break down an algorithm into a series of steps, turn these steps into methods, and put a series of calls to these methods inside a single template method in a base class. Steps may be abstract or have default implementations. The client provides its own subclass, implements abstract steps, and optionally overrides default ones, but does not override the template method itself. Similar code is pulled up into the base class. Optional steps with empty bodies are called hooks.
    structure: |
      The Abstract Class declares methods that act as steps of an algorithm, as well as the actual template method which calls these methods in a specific order. Concrete Classes can override all of the steps, but not the template method itself.
    applicability: |
      Use the Template Method pattern when you want to let clients extend only particular steps of an algorithm, but not the whole algorithm or its structure. Use the pattern when you have several classes that contain almost identical algorithms with some minor differences, allowing you to pull up similar implementations into a superclass to eliminate duplication.
    how_to_implement: |
      Analyze the algorithm to break it into steps. Create the abstract base class and declare the template method and step methods. Outline the structure in the template method. Consider making the template method final. Add default implementations or abstract declarations for steps. Think of adding hooks. Create concrete subclasses implementing the abstract steps.
    pros_and_cons: |
      Pros: You can let clients override only certain parts of a large algorithm. You can pull the duplicate code into a superclass.
      Cons: Some clients may be limited by the provided skeleton. You might violate the Liskov Substitution Principle by suppressing a default step implementation. Harder to maintain the more steps there are.
    relations_with_other_patterns: |
      Factory Method is a specialization of Template Method, and can serve as a step within it. Template Method is based on inheritance to alter parts of an algorithm. Strategy is based on composition to alter behaviors. Template Method works at the class level (static); Strategy works on the object level (runtime).

  - id: "pattern_visitor"
    name: "Visitor"
    intent: |
      Visitor is a behavioral design pattern that lets you separate algorithms from the objects on which they operate.
    problem: |
      You have geographic information structured as a colossal graph (City, Industry nodes). You need to export the graph to XML. You planned to add an export method to each node class. However, the system architect refused to allow you to alter existing node classes because they are in production. The XML export behavior would also look alien in geodata classes. Adding future formats would force changing these fragile classes again.
    solution: |
      Place the new behavior into a separate class called visitor. The original object is passed to one of the visitor’s methods as an argument. Because elements have different classes, the visitor class defines a set of methods with different signatures. To solve the problem of selecting the correct method without cumbersome conditionals, use Double Dispatch. Objects "accept" a visitor and tell it what visiting method should be executed, passing themselves (`v.visitCity(this)`).
    structure: |
      The Visitor interface declares a set of visiting methods for concrete elements. Concrete Visitors implement variations of the behaviors for different elements. The Element interface declares an `accept` method taking a visitor. Concrete Elements implement `accept` to redirect the call to the proper visitor method. The Client represents a collection or complex object structure.
    applicability: |
      Use the Visitor when you need to perform an operation on all elements of a complex object structure (e.g., object tree). Use the Visitor to clean up the business logic of auxiliary behaviors. Use the pattern when a behavior makes sense only in some classes of a hierarchy, but not others.
    how_to_implement: |
      Declare the visitor interface with visiting methods for each concrete element class. Declare the element interface with an abstract `accept` method. Implement `accept` in all concrete element classes to redirect to the visitor. Create concrete visitor classes for behaviors that can't be implemented inside elements. The client must create visitor objects and pass them into elements via `accept`.
    pros_and_cons: |
      Pros: Open/Closed Principle. You can introduce new behavior working with different objects without changing those classes. Single Responsibility Principle. Visitor objects can accumulate useful information during traversal.
      Cons: You need to update all visitors each time a class gets added or removed from the element hierarchy. Visitors might lack access to private fields and methods of the elements.
    relations_with_other_patterns: |
      You can treat Visitor as a powerful version of the Command pattern capable of executing operations over various objects of different classes. You can use Visitor to execute an operation over an entire Composite tree. You can use Visitor along with Iterator to traverse a complex data structure.