# ==============================================================================
# MAS FRAMEWORK - MEMORY PALACE CONFIGURATION
# ==============================================================================
# This file dictates your team's local "Ground Truth".
# While the MAS framework natively understands architectural patterns (RAG),
# this file overrides the AI with your specific team constraints, security
# standards, and compliance rules.
#
# Schema:
# - trigger: The keyword in the prompt or filename that activates the rule.
# - severity: INFO, WARNING, or CRITICAL.
# - constraint: The absolute rule the AI must follow.
# ==============================================================================

rules:
  # ----------------------------------------------------------------------------
  # SECTION 1: SECURITY & COMPLIANCE (Active by Default)
  # ----------------------------------------------------------------------------
  - trigger: "auth"
    severity: "CRITICAL"
    constraint: "Never implement custom cryptographic algorithms. Use industry-standard libraries (e.g., BCrypt for passwords). Never log tokens or PII."

  - trigger: "sql"
    severity: "CRITICAL"
    constraint: "Never use raw string concatenation for SQL queries to prevent injection attacks. Always use parameterized queries, PreparedStatements, or the established ORM."

  - trigger: "api"
    severity: "CRITICAL"
    constraint: "All public-facing API endpoints must implement rate-limiting headers and return a unified, sanitized JSON error object on failure. Do not leak stack traces to the client."

  - trigger: "file"
    severity: "WARNING"
    constraint: "Any file I/O operations must validate the file path to prevent Directory Traversal attacks. Never trust user-provided file names."

  # ----------------------------------------------------------------------------
  # SECTION 2: TEAM STYLE & ARCHITECTURE CONSTRAINTS (Active by Default)
  # ----------------------------------------------------------------------------
  - trigger: "injection"
    severity: "CRITICAL"
    constraint: "Field injection (e.g., @Autowired) is strictly banned. You must use final fields and Constructor Injection for all dependencies."

  - trigger: "exception"
    severity: "WARNING"
    constraint: "Do not catch generic 'Exception'. Catch specific exceptions and wrap them in the custom domain exception hierarchy (e.g., PaymentProcessingException)."


  # ----------------------------------------------------------------------------
