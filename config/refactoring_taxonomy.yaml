  - id: "RM_Fowler_1"
    name: "Extract Method"
    category: "Fowler"
    nature: "STRUCTURAL"
    multi_file: false
    safety_level: "MEDIUM"
    intent: "Pull a fragment of code out of an existing method and place it into a newly created method."
    execution_constraint: "Create the new method within the same class and replace the original fragment with a call to the new method."

  - id: "RM_Fowler_2"
